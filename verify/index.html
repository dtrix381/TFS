
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildlines Verification</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    main {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 { margin-top: 0; }

    button, .connect-button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #5865F2;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .kick { background: #239b56; }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 8px;
      background: #f0f0f0;
      overflow-wrap: anywhere;
    }

    .small {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Wildlines Verification</h1>
    <p>Connect the Discord account you used to start verification and your Kick account.</p>

    <div id="status" role="status" aria-live="polite">
      Loading your verification session...
    </div>

    <section id="connections" hidden>
      <a id="discordButton" class="connect-button">
        Connect Discord
      </a>

      <a id="kickButton" class="connect-button kick">
        Connect Kick
      </a>

      <p class="small">
        Only connect accounts you own. Your session expires after
        15 minutes. Return to this page after connecting each account.
      </p>
    </section>
  </main>


<script>
  const API = "https://wildlines-verification-test.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session");
  const result = params.get("result");

  const statusElement = document.getElementById("status");
  const connections = document.getElementById("connections");
  const discordButton = document.getElementById("discordButton");
  const kickButton = document.getElementById("kickButton");

  let stopped = false;
  let checking = false;
  let pollingStarted = false;

  const messages = {
    discord_connected: "Discord connected successfully.",
    kick_connected: "Kick connected successfully.",
    discord_mismatch:
      "The Discord account does not match the account that started verification. Please return to your Discord server and try again.",
    discord_error: "Discord connection failed. Please try again.",
    kick_error: "Kick connection failed. Please try again.",
    expired:
      "Your verification session expired. Start again from Discord.",
    config_error:
      "The connection service is not configured correctly. Please contact an administrator."
  };

  connections.hidden = true;

  if (!sessionId) {
    statusElement.textContent =
      "No verification session found. Start from the verification button in Discord.";
    stopped = true;
  } else {
    startSecurityCheck();
  }

  async function startSecurityCheck() {
    statusElement.textContent =
      "Checking your connection security. Please wait...";

    try {
      const response = await fetch(
        `${API}/api/verification/security-check/${encodeURIComponent(sessionId)}`,
        {
          method: "POST"
        }
      );

      const data = await response.json();

      if (data.security_check === "blocked") {
        statusElement.textContent =
          "Verification unsuccessful. Please turn off your VPN or proxy, then try again.";
        stopped = true;
        connections.hidden = true;
        return;
      }

      if (!response.ok || data.security_check !== "clear") {
        statusElement.textContent =
          data.message ||
          "We couldn't complete the security check. Please try again later.";
        stopped = true;
        connections.hidden = true;
        return;
      }

      // Only show account connection buttons after a successful check.
      discordButton.href =
        `${API}/oauth/discord/start/${encodeURIComponent(sessionId)}`;

      kickButton.href =
        `${API}/oauth/kick/start/${encodeURIComponent(sessionId)}`;

      if (result && messages[result]) {
        statusElement.textContent = messages[result];
      }

      connections.hidden = false;

      await checkSession();

      if (!stopped && !pollingStarted) {
        pollingStarted = true;

        setInterval(() => {
          if (!stopped) checkSession();
        }, 5000);
      }
    } catch (error) {
      statusElement.textContent =
        "Could not complete the security check. Please refresh and try again later.";
      stopped = true;
      connections.hidden = true;
    }
  }

  async function checkSession() {
    if (stopped || checking) return;

    checking = true;

    try {
      const response = await fetch(
        `${API}/api/verification/session/${encodeURIComponent(sessionId)}`
      );

      const data = await response.json();

      if (response.status === 404 || response.status === 410) {
        statusElement.textContent =
          "Your verification session is unavailable or expired. Start again from Discord.";
        stopped = true;
        connections.hidden = true;
        return;
      }

      if (!response.ok) {
        statusElement.textContent =
          "Unable to check your session. Please refresh this page.";
        return;
      }

      if (data.status === "vpn_blocked") {
        statusElement.textContent =
          "Verification unsuccessful. Please turn off your VPN or proxy, then try again.";
        stopped = true;
        connections.hidden = true;
        return;
      }

      if (data.status === "security_check_failed") {
        statusElement.textContent =
          "We couldn't complete the security check. Please try again later.";
        stopped = true;
        connections.hidden = true;
        return;
      }

      const discordDone = data.discord_connected;
      const kickDone = data.kick_connected;

      if (discordDone && kickDone) {
        statusElement.textContent =
          "Both accounts are connected. Your account checks and final verification are still pending.";
      } else {
        const connected = [];

        connected.push(
          discordDone ? "Discord: connected" : "Discord: not connected"
        );

        connected.push(
          kickDone ? "Kick: connected" : "Kick: not connected"
        );

        statusElement.textContent = connected.join(" · ");
      }

      discordButton.textContent = discordDone
        ? "Discord Connected"
        : "Connect Discord";

      kickButton.textContent = kickDone
        ? "Kick Connected"
        : "Connect Kick";
    } catch (error) {
      statusElement.textContent =
        "Could not reach the verification service. Please refresh and try again.";
    } finally {
      checking = false;
    }
  }
</script>

</body>
</html>
