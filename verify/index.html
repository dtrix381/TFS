<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlines Verification</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101418;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(90%, 420px);
      padding: 30px;
      box-sizing: border-box;
      background: #1c232b;
      border-radius: 16px;
    }
    h1 { color: #7ee787; }
    p { color: #c9d1d9; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Wildlines Verification</h1>
    <p>This is the verification page.</p>
    <p>Verification services are being set up. Please return to Discord for instructions.</p>
  </main>


<script>
(async function () {
    const statusElement = document.createElement("p");
    statusElement.textContent = "Connecting to verification service...";
    statusElement.setAttribute("id", "backend-status");
    document.body.appendChild(statusElement);

    try {
        const response = await fetch(
            "https://wildlines-verification-test.onrender.com/health"
        );

        if (!response.ok) {
            throw new Error("Server returned HTTP " + response.status);
        }

        const data = await response.json();

        statusElement.textContent =
            data.status === "ok"
                ? "Verification service connected successfully!"
                : "The service responded, but its status is unexpected.";
    } catch (error) {
        statusElement.textContent =
            "Could not connect to the verification service. Please try again.";
        console.error("Verification connection test failed:", error);
    }
})();
</script>

</body>
</html>
