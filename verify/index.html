
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildlines Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
      color: #222;
    }

    main {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }

    #status {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Wildlines Verification</h1>
    <p>Complete the steps shown here to verify your account.</p>
    <p id="status">Checking your verification session...</p>
  </main>

  <script>
    const API = "https://wildlines-verification-test.onrender.com";
    const statusElement = document.getElementById("status");

    async function checkSession() {
      const sessionId = new URLSearchParams(
        window.location.search
      ).get("session");

      if (!sessionId) {
        statusElement.textContent =
          "No verification session found. Please start from Discord.";
        return;
      }

      try {
        const response = await fetch(
          `${API}/api/verification/session/${encodeURIComponent(sessionId)}`
        );

        const data = await response.json();

        if (response.status === 410) {
          statusElement.textContent =
            "Your verification session has expired. Please start again from Discord.";
          return;
        }

        if (!response.ok) {
          statusElement.textContent =
            "This session is invalid or unavailable. Please start again from Discord.";
          return;
        }

        statusElement.textContent =
          `Session found! Status: ${data.status}. ` +
          "Discord and Kick account connection will be added next.";
      } catch (error) {
        console.error("Session check failed:", error);
        statusElement.textContent =
          "Could not connect to the verification service. " +
          "Please check your connection and try again.";
      }
    }

    checkSession();
  </script>
</body>
</html>
